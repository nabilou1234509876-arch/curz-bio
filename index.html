<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>curz | Bio</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --icon-color: #ffffff;
            --overlay-bg: rgba(0, 0, 0, 0.6);
            --widget-bg: rgba(20, 20, 20, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }

        body {
            background-color: #000;
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Background Video */
        #bg-video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translateX(-50%) translateY(-50%);
            z-index: -2;
            object-fit: cover;
            /* Keeps the edit visible but slightly dimmed so text is readable */
            filter: brightness(0.4) contrast(1.1);
        }

        /* Entrance Screen */
        #entrance-screen {
            position: absolute;
            inset: 0;
            background-color: #000;
            backdrop-filter: blur(20px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: opacity 0.8s ease-out, visibility 0.8s;
        }

        .click-text {
            font-size: 1.1rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            animation: pulse 2s infinite;
            color: var(--text-main);
            font-weight: 500;
        }

        @keyframes pulse {
            0% { opacity: 0.3; }
            50% { opacity: 1; text-shadow: 0 0 15px rgba(255,255,255,0.6); }
            100% { opacity: 0.3; }
        }

        /* Volume Button (Top Left) */
        .volume-btn {
            position: fixed;
            top: 25px;
            left: 25px;
            width: 44px;
            height: 44px;
            background: var(--widget-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 20;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.05);
            opacity: 0;
            visibility: hidden;
            transform: scale(0.9);
        }

        .volume-btn:hover {
            background: rgba(40, 40, 40, 0.8);
            transform: scale(1.05);
        }

        .volume-btn i {
            font-size: 1.1rem;
            color: var(--text-main);
        }

        /* Main Center Content */
        #main-content {
            opacity: 0;
            visibility: hidden;
            transform: translateY(10px) scale(0.98);
            transition: opacity 1s ease-out, transform 1s ease-out;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        #main-content.visible, .volume-btn.visible {
            opacity: 1;
            visibility: visible;
            transform: translateY(0) scale(1);
        }

        /* Avatar */
        .avatar-container {
            margin-bottom: 15px;
        }

        .avatar {
            width: 115px;
            height: 115px;
            border-radius: 50%;
            object-fit: cover;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            /* Soft glow matching screenshot */
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.15);
        }

        .avatar:hover {
            transform: scale(1.05);
        }

        /* Name with Sparkle/Glitch Effect */
        .name-container {
            position: relative;
            margin-bottom: 25px;
        }

        .display-name {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 1px;
            position: relative;
            z-index: 2;
            text-shadow: 0 0 20px rgba(255,255,255,0.4);
        }

        /* Simulated sparkles around name */
        .sparkles {
            position: absolute;
            inset: -10px;
            z-index: 1;
            pointer-events: none;
            background-image: 
                radial-gradient(circle at 10% 20%, white 1px, transparent 1.5px),
                radial-gradient(circle at 90% 80%, white 1px, transparent 1.5px),
                radial-gradient(circle at 80% 10%, white 1px, transparent 1.5px),
                radial-gradient(circle at 20% 90%, white 1px, transparent 1.5px),
                radial-gradient(circle at 50% 100%, white 1.5px, transparent 2px),
                radial-gradient(circle at 50% 0%, white 1px, transparent 1.5px);
            opacity: 0.5;
            animation: flicker 4s infinite alternate;
        }

        @keyframes flicker {
            0% { opacity: 0.2; transform: scale(0.95); }
            50% { opacity: 0.6; transform: scale(1.05); }
            100% { opacity: 0.3; transform: scale(1); }
        }

        /* Social Icons */
        .socials {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .socials a {
            color: var(--text-main);
            font-size: 1.8rem;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.9;
        }

        .socials a:hover {
            transform: translateY(-4px) scale(1.1);
            opacity: 1;
            text-shadow: 0 0 15px rgba(255,255,255,0.8);
        }

        .socials svg {
            width: 1.8rem;
            height: 1.8rem;
            fill: currentColor;
            transition: filter 0.3s;
        }

        .socials a:hover svg {
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.6));
        }

        /* Views */
        .views-container {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
            background: rgba(0,0,0,0.4);
            padding: 5px 12px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* Aesthetic Music Player (Bottom Center) */
        .music-player {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 15px;
            width: 450px;
            max-width: 90%;
            z-index: 20;
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease 0.5s; /* Delays fade in */
        }

        .music-player.visible {
            opacity: 1;
            visibility: visible;
        }

        .player-icon {
            width: 48px;
            height: 48px;
            background: var(--widget-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .player-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .player-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .song-title {
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .player-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-muted);
        }

        .player-controls i {
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
            font-size: 0.9rem;
        }

        .player-controls i:hover {
            color: var(--text-main);
            transform: scale(1.1);
        }

        .player-controls .play-btn {
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .progress-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .progress-bar-bg {
            flex: 1;
            height: 3px;
            background: rgba(255,255,255,0.2);
            border-radius: 2px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: var(--text-main);
            width: 0%;
            border-radius: 2px;
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        .progress-fill::after {
            content: '';
            position: absolute;
            right: -4px;
            top: -3.5px;
            width: 10px;
            height: 10px;
            background: var(--text-main);
            border-radius: 50%;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .progress-bar-bg:hover .progress-fill::after {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Looping Background Video containing the audio -->
    <video id="bg-video" loop playsinline>
        <source src="./bg-video.mp4" type="video/mp4">
    </video>

    <!-- Volume Control -->
    <div id="volume-btn" class="volume-btn">
        <i class="fa-solid fa-volume-high" id="volume-icon"></i>
    </div>

    <!-- Entrance Screen -->
    <div id="entrance-screen">
        <div class="click-text">[ click to enter... ]</div>
    </div>

    <!-- Main Floating Content -->
    <main id="main-content">
        
        <div class="avatar-container">
            <img src="https://cdn.discordapp.com/avatars/1153392848490737684/dbad3d657cd5e0e22d5c2f914711bb4e.png?size=256" alt="curz" class="avatar">
        </div>

        <div class="name-container">
            <div class="sparkles"></div>
            <h1 class="display-name">curz</h1>
        </div>

        <div class="socials">
            <!-- TikTok -->
            <a href="https://www.tiktok.com/@yepimdestro" target="_blank">
                <i class="fa-brands fa-tiktok"></i>
            </a>
            
            <!-- Custom Roblox SVG Icon -->
            <a href="https://www.roblox.com/fr/users/5456444336/profile" target="_blank">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4.93 0L0 19.07L19.07 24L24 4.93L4.93 0ZM15.3 14.54L9.46 13.01L11 7.17L16.84 8.7L15.3 14.54Z"/>
                </svg>
            </a>
            
            <!-- Discord -->
            <a href="https://discord.com/users/1153392848490737684" target="_blank">
                <i class="fa-brands fa-discord"></i>
            </a>
        </div>

        <div class="views-container">
            <i class="fa-solid fa-eye"></i> <span id="views">...</span>
        </div>

    </main>

    <!-- Aesthetic Music Player Widget -->
    <div id="music-player" class="music-player">
        <div class="player-icon">
            <i class="fa-solid fa-music"></i>
        </div>
        <div class="player-content">
            <div class="player-top">
                <span class="song-title">edit</span>
                <div class="player-controls">
                    <i class="fa-solid fa-backward-step" id="prev-btn"></i>
                    <i class="fa-solid fa-pause play-btn" id="play-pause-btn"></i>
                    <i class="fa-solid fa-forward-step" id="next-btn"></i>
                </div>
            </div>
            <div class="progress-wrapper">
                <span id="current-time">0:00</span>
                <div class="progress-bar-bg" id="progress-container">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <span id="duration-time">0:14</span>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const entranceScreen = document.getElementById('entrance-screen');
            const mainContent = document.getElementById('main-content');
            const musicPlayer = document.getElementById('music-player');
            const bgVideo = document.getElementById('bg-video');
            const viewCountElement = document.getElementById('views');
            
            // Audio/Video controls
            const volumeBtn = document.getElementById('volume-btn');
            const volumeIcon = document.getElementById('volume-icon');
            const playPauseBtn = document.getElementById('play-pause-btn');
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const progressContainer = document.getElementById('progress-container');
            const progressFill = document.getElementById('progress-fill');
            const currentTimeEl = document.getElementById('current-time');
            const durationTimeEl = document.getElementById('duration-time');

            // Format time in M:SS
            function formatTime(seconds) {
                if (isNaN(seconds)) return "0:00";
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return `${m}:${s < 10 ? '0' : ''}${s}`;
            }

            // Real API View Counter
            fetch('https://api.counterapi.dev/v1/curz-bio/profile/up')
                .then(res => res.json())
                .then(data => {
                    viewCountElement.textContent = data.count.toLocaleString();
                })
                .catch(() => {
                    viewCountElement.textContent = "0";
                });

            // Entrance Click Event
            entranceScreen.addEventListener('click', () => {
                entranceScreen.style.opacity = '0';
                entranceScreen.style.visibility = 'hidden';

                // Setup Video
                bgVideo.muted = false; // Start unmuted
                bgVideo.volume = 0.6;
                bgVideo.play().catch(error => console.log("Autoplay prevented:", error));

                // Reveal UI Elements
                setTimeout(() => {
                    mainContent.classList.add('visible');
                    volumeBtn.classList.add('visible');
                    musicPlayer.classList.add('visible');
                }, 400);
            });

            // --- Music Player Logic ---

            // Update metadata (duration) once loaded
            bgVideo.addEventListener('loadedmetadata', () => {
                durationTimeEl.textContent = formatTime(bgVideo.duration);
            });

            // If metadata is already loaded before event listener attaches
            if (bgVideo.readyState >= 1) {
                durationTimeEl.textContent = formatTime(bgVideo.duration);
            }

            // Time Update (Progress Bar)
            bgVideo.addEventListener('timeupdate', () => {
                const current = bgVideo.currentTime;
                const duration = bgVideo.duration;
                currentTimeEl.textContent = formatTime(current);
                
                if (duration > 0) {
                    const percent = (current / duration) * 100;
                    progressFill.style.width = `${percent}%`;
                }
            });

            // Click on Progress Bar to Seek
            progressContainer.addEventListener('click', (e) => {
                const rect = progressContainer.getBoundingClientRect();
                const pos = (e.clientX - rect.left) / rect.width;
                bgVideo.currentTime = pos * bgVideo.duration;
            });

            // Play/Pause Toggle
            function togglePlay() {
                if (bgVideo.paused) {
                    bgVideo.play();
                    playPauseBtn.classList.remove('fa-play');
                    playPauseBtn.classList.add('fa-pause');
                } else {
                    bgVideo.pause();
                    playPauseBtn.classList.remove('fa-pause');
                    playPauseBtn.classList.add('fa-play');
                }
            }

            playPauseBtn.addEventListener('click', togglePlay);

            // Prev/Next (Just restarts video for aesthetic)
            prevBtn.addEventListener('click', () => {
                bgVideo.currentTime = 0;
                if(bgVideo.paused) togglePlay();
            });
            nextBtn.addEventListener('click', () => {
                bgVideo.currentTime = 0;
                if(bgVideo.paused) togglePlay();
            });

            // Volume Toggle
            volumeBtn.addEventListener('click', () => {
                bgVideo.muted = !bgVideo.muted;
                if (bgVideo.muted) {
                    volumeIcon.classList.remove('fa-volume-high');
                    volumeIcon.classList.add('fa-volume-xmark');
                } else {
                    volumeIcon.classList.remove('fa-volume-xmark');
                    volumeIcon.classList.add('fa-volume-high');
                }
            });
        });
    </script>
</body>
</html>
